<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九九乘法挑戰</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <audio id="bgMusic" loop src="assets/bg_music/bg_music.mp3"></audio> <div id="exitModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #FF6B6B; margin-bottom: 20px;">確定要離開嗎？</h3>
            <p style="color: #666; margin-bottom: 20px;">目前的遊戲進度將會遺失唷！</p>
            <div class="modal-buttons">
                <button class="modal-btn cancel" onclick="closeExitModal()">繼續遊戲</button>
                <button class="modal-btn" onclick="confirmExit()">確定離開</button>
            </div>
        </div>
    </div>

    <div id="nameModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #4ECDC4; margin-bottom: 20px;">恭喜！請輸入你的大名：</h3>
            <input type="text" id="playerNameInput" placeholder="你的名字" style="padding: 10px; border: 2px solid #4ECDC4; border-radius: 8px; width: 80%; text-align: center; font-size: 1.1em;">
            <div class="modal-buttons">
                <button class="modal-btn" onclick="saveScoreAndShowRank()">確定</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="start-screen active">
            <h1>九九乘法挑戰</h1>
            <p style="font-size: 1.2em; color: #666; margin: 20px 0;">選擇挑戰模式，開始練習九九乘法吧！</p>

            <div class="challenge-mode-selector">
                <button class="challenge-mode-btn" id="timeChallengeBtn" onclick="selectChallengeMode('time')">時間挑戰 (60秒)</button>
                <button class="challenge-mode-btn" id="questionChallengeBtn" onclick="selectChallengeMode('questions')">題數挑戰 (自選題數)</button>
            </div>

            <div class="question-selection">
                <h3 style="color: #FF6B6B; margin-bottom: 20px;">選擇練習範圍：</h3>
                <div class="multiplication-selector" style="margin-bottom: 25px;">
                    <h4 style="color: #4ECDC4; margin-bottom: 15px;">選擇乘法表 (可複選)：</h4>
                    <div class="number-grid">
                        <button class="number-btn" data-number="2" onclick="toggleNumber(2)">2</button>
                        <button class="number-btn" data-number="3" onclick="toggleNumber(3)">3</button>
                        <button class="number-btn" data-number="4" onclick="toggleNumber(4)">4</button>
                        <button class="number-btn" data-number="5" onclick="toggleNumber(5)">5</button>
                        <button class="number-btn" data-number="6" onclick="toggleNumber(6)">6</button>
                        <button class="number-btn" data-number="7" onclick="toggleNumber(7)">7</button>
                        <button class="number-btn" data-number="8" onclick="toggleNumber(8)">8</button>
                        <button class="number-btn" data-number="9" onclick="toggleNumber(9)">9</button>
                    </div>
                    <button class="question-btn" onclick="selectAllNumbers()" style="margin-top: 10px; font-size: 1em;">全選</button>
                    <button class="question-btn" onclick="clearAllNumbers()" style="margin-top: 10px; font-size: 1em;">清除</button>
                </div>

                <div id="questionCountSelection" style="display: none;">
                    <h4 style="color: #FF6B6B; margin-bottom: 15px;">選擇題數：</h4>
                    <button class="question-btn" onclick="selectQuestions(5)">5 題</button>
                    <button class="question-btn" onclick="selectQuestions(10)">10 題</button>
                    <button class="question-btn" onclick="selectQuestions(30)">30 題</button>
                    <div class="custom-input">
                        <label style="font-size: 1.1em; color: #666;">自選題數：</label>
                        <input type="number" id="customQuestions" min="1" max="100" placeholder="輸入題數">
                        <button class="question-btn" onclick="selectCustomQuestions()">確定</button>
                    </div>
                </div>
            </div>
            <button class="start-btn" onclick="startGame()" id="startBtn">請選擇模式、乘法表和題數</button>
            <button class="restart-btn" onclick="showLeaderboard()">查看排行榜</button>
        </div>

        <div class="game-screen">
            <div class="game-header">
                <div class="score">得分: <span id="score">0</span></div>
                <div class="timer" id="timer">⏰ 00:00</div>
                <div class="progress">題目: <span id="currentQ">1</span>/<span id="totalQ">10</span></div>
                <button class="exit-btn" onclick="showExitModal()">離開</button>
            </div>
            <div class="question-display" id="question"></div>
            <input type="text" class="answer-input" id="answerInput" readonly placeholder="請用下方按鈕輸入">
            <div class="keypad">
                <button class="key-btn" onclick="inputNumber(1)">1</button>
                <button class="key-btn" onclick="inputNumber(2)">2</button>
                <button class="key-btn" onclick="inputNumber(3)">3</button>
                <button class="key-btn" onclick="inputNumber(4)">4</button>
                <button class="key-btn" onclick="inputNumber(5)">5</button>
                <button class="key-btn" onclick="inputNumber(6)">6</button>
                <button class="key-btn" onclick="inputNumber(7)">7</button>
                <button class="key-btn" onclick="inputNumber(8)">8</button>
                <button class="key-btn" onclick="inputNumber(9)">9</button>
                <button class="key-btn special" onclick="backspace()">退後</button>
                <button class="key-btn" onclick="inputNumber(0)">0</button>
                <button class="key-btn special" onclick="submitAnswer()">輸入</button>
            </div>
            <div class="feedback" id="feedback"></div>
        </div>

        <div class="result-screen">
            <h2 style="color: #FF6B6B; margin-bottom: 20px;">🎉 挑戰結束！</h2>
            <div class="result-summary">
                <div class="final-score">總得分: <span id="finalScore">0</span></div>
                <p><strong>答對題數:</strong> <span id="correctCount">0</span></p>
                <p><strong>答錯題數:</strong> <span id="incorrectCount">0</span></p>
                <p><strong>正確率:</strong> <span id="accuracy">0</span>%</p>
                <p><strong>總用時:</strong> <span id="totalTime">00:00</span></p>
                <p style="font-size: 0.9em; color: #666; margin-top: 10px;">
                    已練習過題數: <span id="completedQuestions">0</span>/<span id="totalPossible">64</span>
                     (<span id="selectedTables"></span>)
                </p>
            </div>
            <div id="wrongQuestions" style="margin: 20px 0;"></div>
            <button class="restart-btn" onclick="restartGame()">重新開始</button>
            <button class="restart-btn" onclick="practiceWrong()" id="practiceBtn" style="display: none;">練習錯題</button>
            <button class="restart-btn" onclick="resetAllQuestions()" style="background: linear-gradient(45deg, #FF6B6B, #FF8E53);">重置題目庫</button>
            <button class="restart-btn" onclick="showLeaderboard()">查看排行榜</button>
        </div>

        <div class="rank-screen">
            <h2>🏆 排行榜</h2>
            <div class="leaderboard-toggle">
                <button id="showTimeRankBtn" onclick="displayLeaderboard('time')">時間挑戰榜</button>
                <button id="showQuestionRankBtn" onclick="displayLeaderboard('questions')">題數挑戰榜</button>
            </div>
            <ul id="leaderboardList" class="leaderboard-list">
                </ul>
            <button class="clear-leaderboard-btn" onclick="clearLeaderboard()">清空排行榜</button>
            <button class="restart-btn" onclick="restartGame()">返回首頁</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
